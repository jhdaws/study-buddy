name: CI

# Runs on every push and every pull request. Set up in Sprint 1 deliberately:
# it is roughly an hour of work and it guards every merge for the rest of the
# semester. See docs/adr/0005-ci-in-sprint-one.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The build only needs these to be present and well-formed, not real:
      # no page hits Supabase at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Tests that need real Postgres behaviour -- locks, constraints, RLS. Starts
  # only the database container, not the whole local Supabase stack, and
  # applies every migration in supabase/migrations/ on the way up.
  db:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local database
        run: npx supabase db start

      - name: Database tests
        run: npm run test:db
