name: CI

# Runs on every pull request, every push to main, and every `sprint*` tag (the
# sprint3 tag's run is the graded "green run"). Set up in Sprint 1
# deliberately; see docs/adr/0005-ci-in-sprint-one.md.
#
# Stages, in order, stopping at the first failure:
#   verify           install (npm ci, from package-lock.json) -> seed check
#                    -> lint -> typecheck -> unit tests with the coverage gate
#                    -> build
#   db, e2e          integration tests: real Postgres, and browser journeys
#                    against the full local stack -- only once verify passed
#   coverage-report  published only once every test stage has passed
#   security         dependency audit, SAST and secret scan -- alongside
#                    verify, not after it (docs/security/scans.md)
# Delivery is outside this file: Vercel deploys every merge to main (and a
# preview per PR), and deploy-db.yml applies migrations after this passes.

on:
  push:
    branches: [main]
    tags: ["sprint*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The build only needs these to be present and well-formed, not real:
      # no page hits Supabase at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # supabase/seed.sql is generated from data/ by scripts/build-seed.mjs.
      # Regenerate it and fail if the committed file differs -- one was
      # edited without the other. Needs no database.
      - name: Seed matches data/
        run: |
          npm run db:seed
          git diff --exit-code supabase/seed.sql || {
            echo "::error file=supabase/seed.sql::seed.sql does not match data/. Run 'npm run db:seed' and commit the result."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # With coverage: vitest.config.mts sets the thresholds, so a PR that
      # lowers coverage below them fails here (W9).
      - name: Unit tests and coverage
        run: npm run test:coverage

      # Handed to the last stage, coverage-report.
      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

  # Tests that need real Postgres behaviour -- locks, constraints, RLS. Starts
  # only the database container, not the whole local Supabase stack, and
  # applies every migration in supabase/migrations/, then supabase/seed.sql,
  # on the way up.
  db:
    # Integration tests run only after unit tests pass.
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local database
        run: npx supabase db start

      - name: Database tests
        run: npm run test:db

      # src/lib/database.types.ts is generated from the schema. Regenerate it
      # from the database started above and fail if the committed file
      # differs -- a migration landed without `npm run db:types`.
      - name: Generated types match the schema
        run: |
          npm run db:types
          git diff --exit-code src/lib/database.types.ts || {
            echo "::error file=src/lib/database.types.ts::database.types.ts does not match the migrations. Run 'npm run db:reset && npm run db:types' and commit the result."
            exit 1
          }

  # The main journeys in a real browser (W8, #37): the app built for
  # production, against the full local Supabase stack -- database, auth, API
  # and the Mailpit inbox the sign-in codes are read from. Not a required check
  # yet: add it to the ruleset once it has run a week without flaking
  # (docs/tickets.md, W8). See playwright.config.ts.
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase (database, auth, API, Mailpit)
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end journeys
        run: npm run test:e2e

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The security stage (SEC-06, SEC-07): three scans, triaged in
  # docs/security/scans.md. Needs nothing from verify, so it runs beside it.
  # Each scan runs even if an earlier one failed, so one red step does not
  # hide another. Actions are pinned to commit SHAs, the tools to exact
  # versions (Dependabot updates the SHAs).
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth 0: every commit on every branch and tag, for gitleaks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Production dependencies only: dev tooling is never deployed. Fails on
      # High or Critical. Reads package-lock.json, so needs no install.
      - name: Dependency audit (npm audit)
        run: npm audit --omit=dev --audit-level=high

      # SAST. Every finding is printed; only ERROR-severity ones fail the step.
      - name: SAST (Semgrep)
        if: ${{ !cancelled() }}
        env:
          SEMGREP_VERSION: 1.184.0
        run: |
          pipx install "semgrep==${SEMGREP_VERSION}"
          semgrep scan --metrics=off \
            --config p/javascript --config p/typescript --config p/react --config p/nextjs \
            --json-output="$RUNNER_TEMP/semgrep.json"
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' "$RUNNER_TEMP/semgrep.json")
          echo "Semgrep ERROR findings: $errors"
          if [ "$errors" -gt 0 ]; then
            echo "::error::Semgrep found $errors ERROR-severity finding(s); see the output above."
            exit 1
          fi

      # The full history of what this run checks: main on a push, or the PR
      # merged into main on a pull request (--log-opts=HEAD). Not --all, the
      # default: with fetch-depth 0 that also scans every other open branch,
      # so one branch's finding turned main and every PR red (BUG-18).
      # Suppressions live in .gitleaksignore, each with its reason. --redact
      # keeps values out of this public log. The release is pinned by checksum.
      - name: Secret scan (gitleaks, full history)
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --log-opts=HEAD --redact --verbose --exit-code 1 .

  # The last stage: once unit and integration tests have all passed, publish
  # the unit-test coverage -- a table on the run's summary page, and the full
  # HTML report as the `coverage` artifact. The gate itself is in verify
  # (thresholds in vitest.config.mts).
  coverage-report:
    needs: [verify, db, e2e]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Coverage summary
        run: |
          node -e '
            const total = require("./coverage/coverage-summary.json").total;
            const rows = ["statements", "branches", "functions", "lines"].map(
              (metric) => `| ${metric} | ${total[metric].pct}% | ${total[metric].covered} / ${total[metric].total} |`,
            );
            console.log(["### Unit-test coverage", "", "| Metric | Covered | Count |", "| --- | --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
