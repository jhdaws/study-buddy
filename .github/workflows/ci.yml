name: CI

# Runs on every push and every pull request. Set up in Sprint 1 deliberately:
# it is roughly an hour of work and it guards every merge for the rest of the
# semester. See docs/adr/0005-ci-in-sprint-one.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The build only needs these to be present and well-formed, not real:
      # no page hits Supabase at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # supabase/seed.sql is generated from data/ by scripts/build-seed.mjs.
      # Regenerate it and fail if the committed file differs -- one was
      # edited without the other. Needs no database.
      - name: Seed matches data/
        run: |
          npm run db:seed
          git diff --exit-code supabase/seed.sql || {
            echo "::error file=supabase/seed.sql::seed.sql does not match data/. Run 'npm run db:seed' and commit the result."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Tests that need real Postgres behaviour -- locks, constraints, RLS. Starts
  # only the database container, not the whole local Supabase stack, and
  # applies every migration in supabase/migrations/, then supabase/seed.sql,
  # on the way up.
  db:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local database
        run: npx supabase db start

      - name: Database tests
        run: npm run test:db

      # src/lib/database.types.ts is generated from the schema. Regenerate it
      # from the database started above and fail if the committed file
      # differs -- a migration landed without `npm run db:types`.
      - name: Generated types match the schema
        run: |
          npm run db:types
          git diff --exit-code src/lib/database.types.ts || {
            echo "::error file=src/lib/database.types.ts::database.types.ts does not match the migrations. Run 'npm run db:reset && npm run db:types' and commit the result."
            exit 1
          }

  # The main journeys in a real browser (W8, #37): the app built for
  # production, against the full local Supabase stack -- database, auth, API
  # and the Mailpit inbox the sign-in codes are read from. Not a required check
  # yet: add it to the ruleset once it has run a week without flaking
  # (docs/tickets.md, W8). See playwright.config.ts.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase (database, auth, API, Mailpit)
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end journeys
        run: npm run test:e2e

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
