name: Push migrations

# Reusable: apply supabase/migrations/ at `ref` to the Supabase project of one
# GitHub environment. Called by deploy-db.yml; it has no trigger of its own.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding SUPABASE_PROJECT_ID and the secrets
        required: true
        type: string
      ref:
        description: Commit whose migrations to apply
        required: true
        type: string

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Optional. Without it the CLI connects through a temporary login role
      # it creates with the access token ("Initialising login role..."),
      # checked 2026-10-13. Set it only if that ever stops working.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Skip an environment that is not set up
        id: configured
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::No SUPABASE_PROJECT_ID in the '${{ inputs.environment }}' environment; nothing to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::'${{ inputs.environment }}' has SUPABASE_PROJECT_ID but no SUPABASE_ACCESS_TOKEN secret."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.configured.outputs.ready == 'true'
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      # The Supabase CLI is a devDependency, pinned by package-lock.json.
      - name: Install dependencies
        if: steps.configured.outputs.ready == 'true'
        run: npm ci

      - name: Link the project
        if: steps.configured.outputs.ready == 'true'
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # --include-all: tracks work in parallel, so a migration created earlier
      # can merge after a later one. Without it, db push refuses anything
      # older than the newest migration already applied (HANDOFF, 2026-10-06).
      - name: Show what will be applied
        if: steps.configured.outputs.ready == 'true'
        run: npx supabase db push --include-all --dry-run

      - name: Apply migrations
        if: steps.configured.outputs.ready == 'true'
        run: npx supabase db push --include-all --yes
