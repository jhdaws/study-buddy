name: Push migrations

# Reusable: apply supabase/migrations/ at `ref` to the Supabase project of one
# GitHub environment. Called by deploy-db.yml (the by-hand re-run); it has no
# trigger of its own. The steps themselves are the composite action
# .github/actions/push-migrations, which deploy.yml also uses (V3, #149).

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding SUPABASE_PROJECT_ID and the secrets
        required: true
        type: string
      ref:
        description: Commit whose migrations to apply
        required: true
        type: string

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Optional. Without it the CLI connects through a temporary login role
      # it creates with the access token ("Initialising login role..."),
      # checked 2026-10-13. Set it only if that ever stops working.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Skip an environment that is not set up
        id: configured
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::No SUPABASE_PROJECT_ID in the '${{ inputs.environment }}' environment; nothing to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::'${{ inputs.environment }}' has SUPABASE_PROJECT_ID but no SUPABASE_ACCESS_TOKEN secret."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ready == 'true'
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      # The Supabase CLI is a devDependency, pinned by package-lock.json.
      - name: Install dependencies
        if: steps.configured.outputs.ready == 'true'
        run: npm ci

      - name: Apply migrations
        if: steps.configured.outputs.ready == 'true'
        uses: ./.github/actions/push-migrations
