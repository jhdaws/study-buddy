# Local full stack: app image + Supabase (Postgres, Auth, API, Realtime, Mailpit).
# Sprint 5 V2 / ADR 0012.
#
#   cp .env.example .env
#   docker compose up --build
#
# Then open http://localhost:3000. The Supabase CLI runs via the Docker socket
# so Auth, Realtime and Mailpit match `npm run db:start`.

name: study-buddy

services:
  supabase:
    image: node:22-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - supabase-npm-cache:/root/.npm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Local demo service_role JWT (public; matches `supabase start`).
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://host.docker.internal:54321/auth/v1/health >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends curl ca-certificates
        rm -rf /var/lib/apt/lists/*
        npm install -g supabase@2.120.0
        cd /workspace
        supabase start
        # Fixture Places for the local picker (same as npm run db:seed:locations).
        NEXT_PUBLIC_SUPABASE_URL=http://host.docker.internal:54321 \
          node scripts/seed-local-locations.mjs || true
        echo "Local Supabase is up (API on host port 54321)."
        # Keep the compose service alive while the sibling containers run.
        while curl -fsS http://host.docker.internal:54321/auth/v1/health >/dev/null; do
          sleep 30
        done
        exit 1

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined at build time for the browser bundle. Local demo JWT values
        # match `supabase start` (public, not secrets). Override via .env.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://host.docker.internal:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://host.docker.internal:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY:-}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
    depends_on:
      supabase:
        condition: service_healthy

volumes:
  supabase-npm-cache:
