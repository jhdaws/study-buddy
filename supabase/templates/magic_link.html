<h2>Sign in to Study Buddy</h2>

<p>Tap the button to sign in. It works once and expires in an hour.</p>

<p>
  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
     style="display: inline-block; padding: 12px 20px; background: #13294b; color: #ffffff; border-radius: 10px; text-decoration: none; font-weight: 600;">
    Sign in to Study Buddy
  </a>
</p>

<p>If the button doesn't work, type this code on the Study Buddy sign-in page instead:</p>

<p style="font-size: 28px; font-weight: bold; letter-spacing: 4px; font-family: monospace;">{{ .Token }}</p>

<p>If you didn't ask to sign in to Study Buddy, you can ignore this email.</p>
